name: Release

on:
  push:
    tags:
      - 'v*'
  # Run from the Actions tab (or the API) to release main as it stands:
  # electron-builder creates the v<package.json version> release and its tag.
  # Bump package.json first — publishing an existing version adds to that
  # release instead of making a new one.
  workflow_dispatch: {}

# electron-builder needs to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # Decide whether the macOS signing/notarization secrets are present.
  # Without them we SKIP the macOS job (rather than fail it) so Windows can
  # still ship. See SIGNING.md for the five secrets that turn this on.
  check-signing:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.check.outputs.mac }}
    steps:
      - id: check
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] \
             && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=macOS build skipped::Apple signing secrets are missing; the macOS job is skipped. See SIGNING.md."
            echo "mac=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the meeting-audio helper (Rust)
        run: cargo build --release --manifest-path native/win-audio-helper/Cargo.toml
      - name: Build & publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow uploading to the release even if a sibling job created it
          # more than 2h earlier (notarization can be slow). Without this,
          # electron-builder silently skips the upload on an "old" release.
          EP_GH_IGNORE_TIME: "true"

  macos:
    # Wait for the Windows job: both publish to the same GitHub Release, and when
    # they started together each one created its own "v1.1.3" release (Windows
    # files in one, macOS in the other), breaking the macOS download and update.
    # !cancelled() keeps the macOS release going if the Windows job fails.
    needs: [check-signing, windows]
    if: ${{ !cancelled() && needs.check-signing.outputs.mac == 'true' }}
    # Pinned below -latest deliberately: electron-builder's keychain import
    # (`security set-key-partition-list -k <cert password>`, which should be
    # the *keychain's* password, not the cert's — see app-builder-lib's
    # macCodeSign.js importCerts()) fails with "SecKeychainUnlock: the user
    # name or passphrase you entered is not correct" on newer macOS runner
    # images. macos-14 is the last one this repo verified working.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build, sign, notarize & publish macOS app
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
